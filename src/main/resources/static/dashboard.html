<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tienda Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="topbar">
        <span id="welcomeMsg">Tienda Web</span>
        <button id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="dashboard-wrapper">
        <div class="sell-form" id="sellForm" style="display:none;">
            <h2>Publicar un producto</h2>
            <form id="productForm">
                <label for="name">Nombre</label>
                <input type="text" id="name" required>

                <label for="description">Descripción</label>
                <textarea id="description" rows="2"></textarea>

                <label for="price">Precio</label>
                <input type="number" id="price" min="0" step="0.01" required>

                <button type="submit">Publicar producto</button>
                <div class="error" id="productError"></div>
            </form>
        </div>

        <div id="productsContainer">
            <div class="empty-message">Cargando productos...</div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function init() {
            let user;
            try {
                user = await apiRequest("/api/auth/me", "GET");
            } catch (err) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("welcomeMsg").textContent = "Hola, " + user.username;

            if (user.role === "SELLER") {
                document.getElementById("sellForm").style.display = "block";
            }

            await loadProducts();
        }

        async function loadProducts() {
            const container = document.getElementById("productsContainer");
            const products = await apiRequest("/api/products", "GET");

            if (!products || products.length === 0) {
                container.innerHTML = '<div class="empty-message">No hay productos en venta</div>';
                return;
            }

            container.innerHTML = '<div class="products-grid"></div>';
            const grid = container.querySelector(".products-grid");

            products.forEach((product) => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML =
                    "<h3>" + escapeHtml(product.name) + "</h3>" +
                    "<p>" + escapeHtml(product.description || "") + "</p>" +
                    '<p class="product-price">$' + Number(product.price).toFixed(2) + "</p>" +
                    '<p class="product-seller">Vendido por: ' + escapeHtml(product.sellerUsername) + "</p>";
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const description = document.getElementById("description").value;
            const price = document.getElementById("price").value;
            const errorMsg = document.getElementById("productError");
            errorMsg.textContent = "";

            try {
                await apiRequest("/api/products", "POST", { name, description, price: Number(price) });
                document.getElementById("productForm").reset();
                await loadProducts();
            } catch (err) {
                errorMsg.textContent = err.message;
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await apiRequest("/api/auth/logout", "POST");
            window.location.href = "login.html";
        });

        init();
    </script>
</body>
</html>
