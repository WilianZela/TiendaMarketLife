<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Crear cuenta</h1>
        <form id="registerForm">
            <label for="username">Usuario</label>
            <input type="text" id="username" required minlength="3">

            <label for="email">Correo</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" required minlength="6">

            <div class="checkbox-row">
                <input type="checkbox" id="seller">
                <label for="seller">Quiero registrarme como vendedor</label>
            </div>

            <button type="submit">Registrarme</button>
            <div class="error" id="errorMsg"></div>
        </form>
        <div class="link-row">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const seller = document.getElementById("seller").checked;
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.textContent = "";

            try {
                await apiRequest("/api/auth/register", "POST", { username, email, password, seller });
                await apiRequest("/api/auth/login", "POST", { username, password });
                window.location.href = "dashboard.html";
            } catch (err) {
                errorMsg.textContent = err.message;
            }
        });
    </script>
</body>
</html>
